<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Valutazione Appartamento</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: auto; padding: 20px; }
    h1 { text-align: center; }
    .question { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    select, textarea, button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<h1>Valuta il tuo soggiorno</h1>

<form action="https://formspree.io/f/xgopyeqq" method="POST">

  <div class="question">
    <label>Pulizia</label>
    <select name="pulizia">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </div>

  <div class="question">
    <label>Comfort del letto</label>
    <select name="letto">
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>
  </div>

  <div class="question">
    <label>Posizione</label>
    <select name="posizione">
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>
  </div>

  <div class="question">
    <label>Servizi (WiFi, cucina, ecc.)</label>
    <select name="servizi">
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>
  </div>

  <div class="question">
    <label>Check-in</label>
    <select name="checkin">
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>
  </div>

  <div class="question">
    <label>Comunicazione con host</label>
    <select name="comunicazione">
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>
  </div>

  <div class="question">
    <label>Rapporto qualità/prezzo</label>
    <select name="qualita">
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>
  </div>

  <div class="question">
    <label>Consiglieresti questo appartamento?</label>
    <select name="consiglio">
      <option>Sì</option>
      <option>No</option>
    </select>
  </div>

  <div class="question">
    <label>Cosa ti è piaciuto di più?</label>
    <textarea name="positivo"></textarea>
  </div>

  <div class="question">
    <label>Cosa possiamo migliorare?</label>
    <textarea name="miglioramenti"></textarea>
  </div>

  <button type="submit">Invia feedback</button>

</form>

</body>
</html>
