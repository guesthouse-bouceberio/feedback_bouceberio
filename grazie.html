<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grazie</title>

<meta name="description" content="Accoglienti appartamenti indipendenti per vacanze a Fénis in Valle d'Aosta. Vicino al Castello di Fénis, Aosta e alle montagne più belle della regione.">

<meta property="og:title" content="Appartamento Vacanze a Fénis">
<meta property="og:description" content="Scopri i nostri appartamenti nel cuore della Valle d'Aosta">
<meta property="og:type" content="website">
<meta property="og:image" content="header.jpg">

<meta name="theme-color" content="#2f5d50">

<!-- PERFORMANCE FONT -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>

body{
  font-family:'Inter', sans-serif;
  margin:0;

  display:flex;
  flex-direction: column; /* 👈 QUESTO RISOLVE */

  align-items:center;
  justify-content:center;
  min-height:100vh;

  text-align:center;

  background: linear-gradient(
    to bottom,
    #bcd8cc 0%,
    #8fb3a3 30%,
    #d6cec2 70%,
    #b8aea0 100%
  );
}

.container{
max-width:850px;
margin:40px auto;

background: #ffffff;
backdrop-filter: blur(6px);
border-radius: 20px;

padding: 25px;
box-shadow: 0 15px 40px rgba(0,0,0,0.12);
animation: fadeIn 0.6s ease;
    }
@keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px);} 
      to { opacity: 1; transform: translateY(0);} 
    }

    h1 {
  text-align: center;
  font-size: 30px;
  margin-bottom: 25px;
  color: #2f5d50;
  position: relative;
}

h1::after {
  content: "";
  display: block;
  width: 60px;
  height: 3px;
  background: #8CBDAA;
  margin: 10px auto 0;
  border-radius: 2px;
}

    .question {
  margin-bottom: 18px;
  padding: 16px;
  border-radius: 14px;
  background: #f1f5f4;
  border: 1px solid #d6e0dc;
  transition: 0.25s;
}

.question:hover {
  background: #edf3f1;
  transform: translateY(-2px);
}

  .question label {
  display: block;
  font-weight: 500;
  margin-bottom: 6px;
  color: #2f5d50;
  font-size: 15px;
}

  .question:focus-within {
  border-color: #8CBDAA;
  box-shadow: 0 0 0 2px rgba(140,189,170,0.2);
}
    .stars { display: flex; gap: 6px; font-size: 26px; cursor: pointer; }

   .stars span {
  color: #ddd;
  transition: transform 0.2s, color 0.2s;
}

.stars span:hover {
  transform: scale(1.2);
}

.stars span.active {
  color: #f5b301;
}

   textarea, select {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #dcdcdc;
  margin-top: 6px;
  font-size: 14px;
  background: #fcfcfc;
  transition: 0.2s;
  box-sizing: border-box;
}

textarea:focus, select:focus {
  border-color: #8CBDAA;
  outline: none;
  background: white;
}

    button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #2f5d50, #3f7a6b);
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
  font-weight: 500;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}


  /* HEADER */

header{
background:
linear-gradient(rgba(9, 9, 9, 1), rgba(20,40,35,0.55)),
url('header_transparent.png') center bottom/contain no-repeat;

width:100%;
display:flex;
flex-direction:column;
justify-content:center;
}

 /* LOGO */
 .logo {
  width: 33%;
  max-width: 1536px;
  height: auto;
  object-fit: contain;
  display: block;
  margin: 0 auto;
}

/* MOBILE */
@media (max-width: 768px) {
  .logo {
    width: 70%;
  }
}

  /* TRADUTTORE PULITO */

#google_translate_element{
margin-top:15px;
text-align:center;
}

.goog-logo-link {
display:none !important;
}

.goog-te-gadget span {
display:none !important;
}

.goog-te-gadget {
color:transparent !important;
}

.goog-te-gadget select{
padding:6px 10px;
border-radius:8px;
border:none;
font-size:14px;
width: auto;
display: inline-block;
}
  
</style>

</head>

<body>
<header>

<img src="logo_transparent.png" class="logo">


<div id="google_translate_element"></div>

</header>
  
<div class="container">

  <div class="icon">🙏</div>

  <h1>Grazie per il tuo feedback!</h1>

  <p>
    Il tuo parere è molto importante per noi e ci aiuta a migliorare continuamente
    l’esperienza dei nostri ospiti.
  </p>

  <p>
    Speriamo di rivederti presto in Valle d’Aosta! 🏔️
  </p>

  <a href="https://guesthouse-bouceberio.github.io/guida-ospiti/" class="button">Torna al sito</a>

</div>

  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
